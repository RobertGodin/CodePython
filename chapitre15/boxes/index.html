<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <title>Grille collaborative</title>
    <script type="module">
      // wss:// si la page est servie en HTTPS, sinon ws://
      const socket = new WebSocket(
        (location.protocol === "https:" ? "wss://" : "ws://") +
        location.host + "/ws");

      function getstatus() {
        const boxes = document.querySelectorAll(".box");
        const data = Array.from(boxes, function (box) {
          return box.classList.contains("bleu") ? "b" : "w";
        }).toString();
        return data;
      }

      socket.addEventListener("open", (event) => {
        document.getElementById("message").innerHTML = "ok";
        const boxes = document.querySelectorAll(".box");

        Array.from(boxes, function (box) {
          box.addEventListener("click", function (event) {
            event.target.classList.toggle("bleu");
            const data = getstatus();
            socket.send(data);
            document.getElementById("message").innerHTML = "transmis";
          });
        });
      });

      socket.addEventListener("message", (event) => {
        document.getElementById("message").innerHTML = "reçu";
        const boxes = document.querySelectorAll(".box");
        const data = event.data.split(",");
        Array.from(boxes, function (box, index) {
          box.classList.toggle("bleu", data[index] === "b");
        });
      });

      socket.addEventListener("error", (event) => {
        document.getElementById("message").innerHTML = "erreur";
      });

      socket.addEventListener("close", (event) => {
        document.getElementById("message").innerHTML =
          "fermé (code " + event.code + ")";
      });
    </script>
    <style>
      body {
        background: #d3d3d3;
      }
      #message {
        margin-left: auto;
        margin-right: auto;
        width: 30vw;
        padding: 2em;
      }

      .wrapper {
        margin-left: auto;
        margin-right: auto;
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        grid-template-rows: repeat(8, 1fr);
        width: 30vw;
        height: 30vw;
        gap: 1px;
      }

      .box {
        border: 1px solid black;
        background-color: white;
      }

      .box.bleu {
        background-color: blue;
      }
    </style>
  </head>
