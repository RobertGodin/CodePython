<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Exemple de page html</title>
    <style>
        /* Le pseudo-sélecteur :nth-child(an+b) cible les lignes selon
           leur position : :nth-child(3n+2) désigne les positions
           2, 5, 8, etc. (n = 0, 1, 2, ...) */
        /* La ligne 1 est l'entête : aucune règle ne la sélectionne */

        /* Lignes 2, 5, 8, etc. : 1re, 4e, 7e ligne de données */
        tr:nth-child(3n+2) {
            /* On définit la couleur de fond de ces lignes à rouge */
            background-color: red;
        }

        /* Lignes 3, 6, 9, etc. : 2e, 5e, 8e ligne de données */
        tr:nth-child(3n+3) {
            /* On définit la couleur de fond de ces lignes à bleu */
            background-color: blue;
        }

        /* Lignes 4, 7, 10, etc. : 3e, 6e, 9e ligne de données */
        tr:nth-child(3n+4) {
            /* On définit la couleur de fond de ces lignes à blanc */
            background-color: white;
        }</style>
</head>
<body>
    <h1>Exemple de page html</h1>
    <table>
        <tr>
            <th>Nom</th>
            <th>Prénom</th>
            <th>Age</th>
        </tr>
        <tr>
            <td>Dupont</td>
            <td>Jean</td>
            <td>25</td>
        </tr>
        <tr>
            <td>Durand</td>
            <td>Marie</td>
            <td>30</td>
        </tr>
        <tr>
            <td>Martin</td>
            <td>Pierre</td>
            <td>35</td>
        </tr>
        <tr>
            <td>Luc</td>
            <td>Roger</td>
            <td>33</td>
        </tr>
        <tr>
            <td>Annie</td>
            <td>Marie</td>
            <td>31</td>
        </tr>
    </table>

</body>
</html>
